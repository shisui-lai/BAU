<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkbox Multi-select with Select All</title>
  <style>
    /* 容器设置固定高度并且支持滚动 */
    .checkbox-container {
      height: 200px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 10px;
      width: 200px;
    }

    /* 控制全选复选框的位置 */
    .select-all {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h2>请选择多个选项：</h2>

  <!-- 全选/取消全选框 -->
  <label class="select-all">
    <input type="checkbox" id="selectAll" onclick="toggleSelectAll()"> 全选/取消全选
  </label>

  <!-- 复选框容器，固定高度并支持滚动 -->
  <div class="checkbox-container">
    <label>
      <input type="checkbox" value="option1" class="checkbox"> 选项 1
    </label><br>
    <label>
      <input type="checkbox" value="option2" class="checkbox"> 选项 2
    </label><br>
    <label>
      <input type="checkbox" value="option3" class="checkbox"> 选项 3
    </label><br>
    <label>
      <input type="checkbox" value="option4" class="checkbox"> 选项 4
    </label><br>
    <label>
      <input type="checkbox" value="option5" class="checkbox"> 选项 5
    </label><br>
    <label>
      <input type="checkbox" value="option6" class="checkbox"> 选项 6
    </label><br>
    <label>
      <input type="checkbox" value="option7" class="checkbox"> 选项 7
    </label><br>
    <label>
      <input type="checkbox" value="option8" class="checkbox"> 选项 8
    </label><br>
    <label>
      <input type="checkbox" value="option9" class="checkbox"> 选项 9
    </label><br>
    <label>
      <input type="checkbox" value="option10" class="checkbox"> 选项 10
    </label><br>
  </div>

  <br>
  <button onclick="showSelected()">显示选中的选项</button>

  <p id="result"></p>

  <script>
    // 全选/取消全选函数
    function toggleSelectAll() {
      const selectAllCheckbox = document.getElementById('selectAll');
      const checkboxes = document.querySelectorAll('.checkbox');
      checkboxes.forEach(checkbox => {
        checkbox.checked = selectAllCheckbox.checked;
      });
    }

    // 显示选中的选项
    function showSelected() {
      const checkboxes = document.querySelectorAll('.checkbox:checked');
      const selectedValues = Array.from(checkboxes).map(checkbox => checkbox.value);
      document.getElementById('result').textContent = '你选择的选项是：' + selectedValues.join(', ');
    }
  </script>

</body>
</html>
